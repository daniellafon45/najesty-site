# Cloudflare Workers — config de base (Astro génère dist/server/wrangler.json au build)
name = "najesty-site"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Sous-domaine Stride QC
routes = [
  { pattern = "najesty.stride-qc.ca", custom_domain = true }
]

[[kv_namespaces]]
binding = "SESSION"
id = "f6852911c94846f79209682f052562bd"

[[kv_namespaces]]
binding = "CONTENT"
id = "46215c32e157435d9f85d5dc37f1e353"
